<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="coba.css" />
  </head>
  <body>
    <h1 id="text">CEK KELULUSAN MAHASISWA</h1>
    <div class="tabel-kriteria">
      <p>Kriteria penilaian:</p>
      <ol>
        <li>Bobot nilai ujian 1 = 35%</li>
        <li>Bobot nilai ujian 2 = 35%</li>
        <li>Bobot nilai ujian 3 = 30%</li>
      </ol>
      <p>Mahasiswa dinyatakan <span>lulus</span> jika total skor akhir ujian paling tidak 75</p>
    </div>
    

    <input
      id="input-angka1"
      type="number"
      placeholder="masukkan skor ujian 1"
      min="0" max="100"
    />
    <input
      id="input-angka2"
      type="number"
      placeholder="masukkan skor ujian 2"
      min="0" max="100"
    />
    <input
      id="input-angka3"
      type="number"
      placeholder="masukkan skor ujian 3"
      min="0" max="100"
    />

    <button onclick="send()">cek</button>
    <h3 class="status"></h3>
    <h3 class="score"></h3>

    <script src="coba.js"></script>
  </body>
</html>
